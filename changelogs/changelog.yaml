---
ancestor: null
releases:
  0.2.0:
    changes:
      release_summary: "Hardened Debian 13 base roles: idempotent tasks, valid unattended-upgrades origins, OS assertions."
      breaking_changes:
        - "package_upgrades - role removed; its tasks were merged into package_manager (tasks/upgrades.yml)"
        - "system_tools - fonts task removed; moved to the new mps.terminal collection (fonts role)"
        - "system_settings - all variables renamed with the system_settings_ prefix and grouped per task file"
        - "system_settings - timezone, locale, keyboard and console variables are now system_settings_timezone,"
        - "system_settings - system_settings_locale_*, system_settings_keyboard_* and system_settings_console_* respectively"
        - "system_tools - fonts_dir and fonts_list renamed to system_tools_fonts_dir and system_tools_fonts_list"
        - "system_tools - other.yml renamed to core.yml; the toggle system_tools_other is now system_tools_core"
      bugfixes:
        - "system_settings - main.yml now includes locale.yml and time.yml; timezone and chrony were previously never applied"
        - "system_settings - the locale is now enabled in /etc/locale.gen and generated via locale-gen"
        - "package_manager - replaced the invalid Allowed-Origins lineinfile with a valid Origins-Pattern drop-in"
        - "package_manager - removed the duplicated apt essentials task and the redundant double upgrade"
        - "system_tools - run other.yml before fonts.yml so fontconfig (fc-cache) is available"
      minor_changes:
        - "package_manager - upgrade mode is now configurable via package_manager_upgrade (default dist)"
        - "package_manager - unattended-upgrades setup can now be skipped via package_manager_auto_upgrades (default true)"
        - "package_manager - apt sources are now configurable via package_manager_repos_* and package_manager_components_* flags"
        - "package_manager - deb-src entries can now be toggled globally via package_manager_deb_src (default true)"
        - "system_tools - tool categories can now be toggled via system_tools_<category> boolean flags (all default true)"
        - "system_tools - transfer tools (curl, wget, rsync) moved to transfer.yml with toggle system_tools_transfer"
        - "system_tools - htop moved to stats.yml; fontconfig moved to the mps.terminal fonts role"
        - "package_manager - tasks split into configure.yml, install.yml and upgrades.yml"
        - "system_settings - tasks split into locale.yml, keyboard.yml, console.yml and time.yml"
        - "all roles - assert Debian 13 (trixie) and fail fast on other systems"
