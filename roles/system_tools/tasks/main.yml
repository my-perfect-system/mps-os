---
- name: Assert Debian 13 target
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["distribution_major_version"] | int == 13
    fail_msg: "This role supports Debian 13 (trixie) only"
    quiet: true

- name: Install archive tools
  ansible.builtin.include_tasks: archives.yml
  when: system_tools_enable_archives | bool

- name: Install build toolchain
  ansible.builtin.include_tasks: build.yml
  when: system_tools_enable_build | bool

- name: Install file manager tools
  ansible.builtin.include_tasks: fm.yml
  when: system_tools_enable_fm | bool

- name: Install core system utilities
  ansible.builtin.include_tasks: core.yml
  when: system_tools_enable_core | bool

- name: Install transfer tools
  ansible.builtin.include_tasks: transfer.yml
  when: system_tools_enable_transfer | bool

- name: Install network tools
  ansible.builtin.include_tasks: net.yml
  when: system_tools_enable_net | bool

- name: Install statistics tools
  ansible.builtin.include_tasks: stats.yml
  when: system_tools_enable_stats | bool