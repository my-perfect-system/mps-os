---
- name: Install core system utilities
  ansible.builtin.package:
    name:
      - sudo
      - gnupg
      - lsb-release
      - debconf
      - debconf-utils
      - psmisc
      - rsyslog
      - jq
      - pciutils
      - bsdmainutils
      - psutils
      - firmware-linux
      - tasksel
      - firmware-misc-nonfree
      - firmware-netxen
      - firmware-realtek
    state: present

- name: Run tasksel install standard
  ansible.builtin.shell: |
    tasksel install standard
  become: true
