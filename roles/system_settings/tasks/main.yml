---
- name: Assert Debian 13 target
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["distribution_major_version"] | int == 13
    fail_msg: "This role supports Debian 13 (trixie) only"
    quiet: true

- name: Configure locale
  ansible.builtin.include_tasks: locale.yml

- name: Configure keyboard
  ansible.builtin.include_tasks: keyboard.yml

- name: Configure console
  ansible.builtin.include_tasks: console.yml

- name: Configure time and timezone
  ansible.builtin.include_tasks: time.yml
