---
argument_specs:
  main:
    short_description: Configure APT sources, upgrade packages, and set up unattended-upgrades
    options:
      package_manager_upgrade:
        type: str
        default: dist
        choices:
          - "no"
          - safe
          - "yes"
          - full
          - dist
        description: "apt upgrade mode applied to all packages; 'no' skips the upgrade"
      package_manager_enable_auto_upgrades:
        type: bool
        default: true
        description: "Configure unattended-upgrades for automatic package upgrades"
      package_manager_enable_repos_main:
        type: bool
        default: true
        description: "Enable the main apt repository pocket"
      package_manager_enable_repos_updates:
        type: bool
        default: true
        description: "Enable the updates apt repository pocket"
      package_manager_enable_repos_backports:
        type: bool
        default: true
        description: "Enable the backports apt repository pocket"
      package_manager_enable_repos_security:
        type: bool
        default: true
        description: "Enable the security apt repository pocket"
      package_manager_enable_components_contrib:
        type: bool
        default: true
        description: "Enable the contrib component"
      package_manager_enable_components_non_free:
        type: bool
        default: true
        description: "Enable the non-free component"
      package_manager_enable_components_non_free_firmware:
        type: bool
        default: true
        description: "Enable the non-free-firmware component"
      package_manager_enable_deb_src:
        type: bool
        default: true
        description: "Include deb-src entries for all enabled repository pockets"